[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resonansc-api"
version = "0.3.0"
description = "Tuned three-merge RNA/ATAC alignment integrated with ResonanSC optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.10", "numpy>=1.24", "pandas>=2", "scipy>=1.10",
  "scikit-learn>=1.3", "scanpy>=1.10", "torch>=2.1", "pyyaml>=6",
  "matplotlib>=3.7", "seaborn>=0.12", "igraph>=0.11", "umap-learn>=0.5"
]

[project.optional-dependencies]
legacy-preprocess = ["episcanpy"]
embedding = ["scvi-tools==1.3.3"]
test = ["pytest>=7", "build"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

input:
  init_checkpoint: data/init_for_training.pt
  training_data_dir: data/training_multidata
  init_adata: data/aligned_gene_activity.h5ad
keys:
  batch_key: batch
output:
  output_dir: output/optimization_WM20
  prefix: train
  round: 1
  annotated_h5ad: null
runtime:
  seed: 42
  gpu: '0'
  neighbors_backend: cpu
  gpu_python: null
  multi_gpu: false
  devices: null
  cuda_visible_devices: '0'
training:
  stages:
  - learn_mapping
  - learn_M
  resume:
    learn_P: null
    learn_mapping: null
    learn_M: learn_mapping
  common:
    one_hot_start: false
    present_eps: 0.04
    rna_chunk_size: 512
    cellbulk_chunk_size: 512
    cache_rna_on_device: false
    marker_init_mode: continuous
    marker_init_eps: 0.05
    verbose_every: 10
  margin:
    learn_P:
    - 0.5
    - 2.0
    - 10.0
    learn_mapping:
    - 0.3
    - 1.5
    - 3.0
    learn_M:
    - 0.3
    - 1.5
    - 3.0
  learn_P:
    epochs: 100
    lr: 0.01
    lambdas:
    - 10.0
    - 10.0
    - 1.0
  learn_mapping:
    epochs: 20
    lr: 0.01
    lambdas:
    - 1.0
    - 1.0
    - 0.0
    mapping_lambdas:
    - 1.0
    - 1.0
  learn_M:
    epochs: 20
    lr: 0.01
    lambdas:
    - 1.0
    - 1.0
    - 0.0
    marker_sparsity: 1.0
plots:
  save: false
merge_align:
  enabled: false
